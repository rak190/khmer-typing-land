<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Khmer Typing Land — NiDA Mode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="mascotBig">🐯</span>
      <span>Khmer Typing Land</span>
      <span class="pill">NiDA Layout Mode</span>
    </div>

    <div class="hud">
      <span id="hudProfile" class="pill"></span>
      <span id="hudStars" class="pill"></span>
      <button id="btnHome" class="btn secondary">Home</button>
    </div>
  </header>

  <main id="view"></main>

  <section class="keyboardWrap">
    <div class="kbTop">
      <div class="kbState">
        <span class="pill">State:</span>
        <span id="statePill" class="pill state">BASE</span>
        <span id="fingerPill" class="pill finger">Finger: —</span>
      </div>

      <div class="kbMascot">
        <span class="small">Mascot:</span>
        <select id="mascotSelect"></select>
      </div>
    </div>

    <div id="keyboard" class="keyboard"></div>
    <div class="hint small">
      Tip: Use <b>Right Alt</b> (AltGr) or <b>Ctrl+Alt</b> for AltGr keys. Hold <b>Shift</b> for Shift layer.
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
